body:before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(500px 400px at 15% 20%,rgba(56,189,248,.22),transparent 60%),radial-gradient(600px 450px at 85% 10%,rgba(29,78,216,.18),transparent 60%),radial-gradient(500px 400px at 70% 90%,rgba(245,179,53,.14),transparent 60%);animation:aur 22s ease-in-out infinite alternate}
@keyframes aur{to{transform:translate(4%,3%) scale(1.08)}}@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.94)}}@keyframes shine{to{transform:translateX(120%)}}
.top{position:fixed;top:0;left:0;right:0;height:64px;z-index:60;padding:0 18px;display:flex;align-items:center}.top .in{width:100%;max-width:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
.lg b{font-size:16px;letter-spacing:.2px}main{max-width:none;margin:0 0 0 230px;padding:84px 24px 40px}
#main>*{animation:up .55s both}#main>*:nth-child(2){animation-delay:.06s}#main>*:nth-child(3){animation-delay:.12s}#main>*:nth-child(4){animation-delay:.18s}#main>*:nth-child(n+5){animation-delay:.24s}
#nav{position:fixed;top:64px;left:0;bottom:0;width:230px;flex-direction:column;justify-content:flex-start;gap:6px;padding:18px 14px;margin:0;max-width:none;background:linear-gradient(180deg,#0a1f5c,#061238);z-index:50;box-shadow:6px 0 24px rgba(7,22,63,.25)}
#nav button{width:100%;justify-content:flex-start;background:transparent;color:#cfe0ff;border:0;border-radius:12px;padding:12px 14px;font-size:14.5px;box-shadow:none}
#nav button:hover{background:rgba(255,255,255,.09);transform:translateX(4px)}#nav button i{font-size:19px;width:26px}
#nav button.on{background:linear-gradient(120deg,#1d4ed8,#38bdf8);color:#fff;box-shadow:0 10px 22px rgba(56,189,248,.35)}
#nav:after{content:"Software Developed by\A Hamnan Ali";white-space:pre;position:absolute;left:14px;right:14px;bottom:16px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);color:#9fb6e8;font-size:11px;line-height:1.55;text-align:center}
.btn{border-radius:10px;transition:transform .15s,box-shadow .2s,background .2s;position:relative;overflow:hidden}.btn:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(10,31,92,.15)}.btn:active{transform:scale(.96)}
.btn.pri:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg)}.btn.pri:hover:after{animation:shine .7s}
.card,.kc{transition:transform .25s,box-shadow .25s}.kc:hover{transform:translateY(-4px);box-shadow:var(--sh2)}
input,select{transition:border-color .2s,box-shadow .2s}input:focus,select:focus{outline:0;border-color:#1d4ed8;box-shadow:0 0 0 3px rgba(29,78,216,.14)}
.sum{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}.sx{flex:1;min-width:130px;background:#fff;border:1px solid var(--bd);border-radius:16px;padding:12px 16px;box-shadow:var(--sh);animation:up .5s both}.sx b{display:block;font-size:26px;color:#0a1f5c}.sx span{color:var(--mut);font-size:12.5px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.bcard,.rbox{display:flex;gap:14px;align-items:center;padding:16px;border-radius:18px;background:#fff;border:1px solid var(--bd);box-shadow:var(--sh);cursor:pointer;position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s,border-color .25s;animation:up .5s both}
.bcard:hover,.rbox:hover{transform:translateY(-6px);box-shadow:var(--sh2);border-color:#7aa2ff}.bcard:before,.rbox:before{content:"";position:absolute;right:-30px;top:-30px;width:100px;height:100px;border-radius:50%;background:#e4eeff;opacity:.8}
.bcard>*,.rbox>*{position:relative}.binfo{flex:1;min-width:0}.binfo b{display:block;font-size:16px;color:#0a1f5c}.binfo span{display:block;color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}.binfo small{color:var(--mut);font-size:12px}
.bnum,.rno{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,#0a1f5c,#1d4ed8);color:#fff;font:800 28px system-ui;flex:none;box-shadow:0 10px 20px rgba(29,78,216,.35)}.rno{font-size:22px;width:56px;height:56px}
.bcard.full .bnum,.rbox.full .rno{background:linear-gradient(135deg,#0f9d6b,#34d399);box-shadow:0 10px 20px rgba(15,157,107,.35)}.bcard.full,.rbox.full{border-color:#8de2c0}
.bcard.add{border:2px dashed #9db8ee;background:rgba(255,255,255,.55);box-shadow:none}.bnum.plus{background:#e4eeff;color:#1d4ed8;box-shadow:none}
.mini{display:flex;margin-top:6px}.mini .av{margin-left:-6px;border:2px solid #fff}.mini .av:first-child{margin-left:0}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#1d4ed8,#38bdf8);color:#fff;font:700 11px system-ui;flex:none;font-style:normal}.av.sm{width:24px;height:24px;font-size:9px}.av.more{background:#cbd5e1;color:#334155}
.nm{display:flex;align-items:center;gap:8px}.lk{color:#0a1f5c;font-weight:700;cursor:pointer}.lk:hover{color:#1d4ed8;text-decoration:underline}
#modal{background:rgba(6,19,47,.58);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);align-items:flex-start;padding:26px 12px;animation:fade .25s both}
.pop{background:#fff;border-radius:24px;max-width:1020px;width:100%;margin:auto;overflow:hidden;box-shadow:var(--sh2);animation:pop .38s cubic-bezier(.2,.9,.3,1.15) both}
.ph3{display:flex;align-items:center;gap:14px;padding:16px 20px;color:#fff;background:radial-gradient(400px 120px at 90% 0,rgba(56,189,248,.4),transparent 70%),linear-gradient(120deg,#06132f,#0a1f5c 55%,#123a9c)}
.bbadge{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,#38bdf8,#1d4ed8);display:grid;place-items:center;font:800 24px system-ui;flex:none;box-shadow:0 8px 18px rgba(0,0,0,.35)}.pt3{flex:1;min-width:0}.pt3 b{display:block;font-size:20px}.pt3 span{font-size:13px;opacity:.85}
.pcx{background:rgba(255,255,255,.16);border:0;color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:15px;transition:.25s}.pcx:hover{background:rgba(255,255,255,.32);transform:rotate(90deg)}
.pbody{padding:18px 20px}.pgrid{display:grid;grid-template-columns:300px 1fr;gap:20px}@media(max-width:860px){.pgrid{grid-template-columns:1fr}}
.big{display:flex;align-items:baseline;gap:6px}.big b{font-size:44px;color:#0a1f5c;line-height:1}.big span{color:var(--mut)}.pbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
label.fl{display:block;margin:12px 0 6px;font-size:12.5px;color:var(--mut);font-weight:600}label.fl.inl{display:flex;align-items:center;gap:6px;margin:0}label.fl select,label.fl input{margin-top:3px}
.srch input{width:100%;padding:14px 18px;border-radius:14px;border:2px solid #cfe0ff;font-size:15px}.sug{margin-top:8px;border:1px solid var(--bd);border-radius:14px;overflow:hidden;background:#fff;box-shadow:var(--sh)}.sug:empty{display:none}
.sg{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--bd);animation:up .25s both}.sg:last-child{border:0}.sg span{flex:1;min-width:0}.sg b{display:block;font-size:14px}.sg small{color:var(--mut);font-size:12px}
.tls.big{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;max-height:58vh;padding:10px 8px 4px}
.tl{display:flex;align-items:center;gap:9px;min-height:58px;animation:up .35s both}.tl>div{min-width:0}.tl b,.tl small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tl i:not(.av){font-style:normal;color:#1d4ed8;font-size:11px;font-weight:700}
.tx{opacity:0;transition:.2s}.tl:hover .tx{opacity:1;transform:scale(1.1)}
.prof{margin-bottom:12px}.pgd{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.pgd label{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);font-weight:700}.pgd p{margin:2px 0 0;font-weight:700;color:#0a1f5c}
.mc{border-radius:20px;box-shadow:var(--sh2);animation:pop .35s cubic-bezier(.2,.9,.3,1.15) both;max-width:460px}.rc{animation:pop .35s both}
.devl{text-align:center;font-size:10px;color:#64748b;margin-top:10px;letter-spacing:.4px}.devl:before{content:"◆ "}
.dev{background:#0a1f5c;color:#cfe0ff;text-align:center;font-size:6.5pt;letter-spacing:.6px;padding:.03in 0;flex:none}.lf .dv{border:0;font-size:8.5pt;font-weight:700;color:#0a1f5c;letter-spacing:.3px}
.pass .pf2{padding:.06in .2in}.pass .pm{padding:.12in .2in}
th{position:sticky;top:0;background:#f3f7ff;z-index:1}tr:hover td{background:#f6f9ff}
#toast{border-radius:14px;padding:11px 20px;box-shadow:var(--sh2);background:linear-gradient(120deg,#06132f,#123a9c);animation:up .3s both}
#login{background:radial-gradient(600px 400px at 20% 10%,rgba(56,189,248,.35),transparent 60%),linear-gradient(135deg,#06132f,#123a9c)}#login .mc{animation:pop .6s both;padding:26px}
.hero:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-60px;bottom:-110px;background:rgba(255,255,255,.07);animation:aur 9s ease-in-out infinite alternate}

 #nav:after{display:none}#nav button{flex-direction:column;gap:1px;padding:6px 4px;font-size:10.5px;color:#334a7a;flex:1;justify-content:center;border-radius:12px}#nav button:hover{transform:none;background:#eef3ff}#nav button i{font-size:20px;width:auto}#nav button.on{background:#e4eeff;color:#0a1f5c;box-shadow:none}}

@media print{.devl,.dev{display:block!important}}
