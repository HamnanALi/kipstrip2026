<style>

</style></head><body>
<div class="top"><div class="in"><div class="lg"><i>K</i><div><b>KIPS College Sheikhupura (Boys)</b><span id="sub"></span></div></div>
<nav id="nav"></nav></div></div>
<main id="main"></main>
<div id="login"><div class="mc"><h3>KIPS College Trip System – Staff Login</h3><label>Email<input id="le" type="email" autocomplete="username"></label><label>Password<input id="lp" type="password" autocomplete="current-password"></label><p id="lerr" style="color:#b91c1c;font-size:13px"></p><button class="btn pri" data-a="login">Sign in</button></div></div>
<div id="modal"><div id="mb" style="width:100%"></div></div><div id="toast"></div>
<script>
let D=[],D0=[],OUT=[];
const M={payments:{},info:{},cfg:{}};const LK='kipsTripV2';let db=null,cloud=0,L=null,view='dash',cy=1,q='',flt='all',BC={};
let SEC=[1,2,3].map(y=>({y,l:[]})),cs='';const rebuild=()=>{D=D0.concat(OUT);mk();render()},mk=()=>{SEC=[1,2,3].map(y=>({y,l:[...new Set(D.filter(s=>s.y==y).map(s=>s.s))]}));if(!cs&&SEC[0].l[0])cs=SEC[0].l[0]};
const $=i=>document.getElementById(i),esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const rs=n=>'Rs '+Math.round(n).toLocaleString('en-US'),yn=y=>y==1?'1st Year':y==2?'2nd Year':'Outsiders',cls2=s=>s.y==3?'Outsider':yn(s.y)+' · '+s.s,S=k=>D.find(x=>x.k==k);
const pays=k=>(M.payments[k]||{}).pays||[],paid=k=>pays(k).reduce((a,p)=>a+p.a,0),info=k=>M.info[k]||{};
const st=k=>{const p=paid(k);return p>=C().fee?'Paid':p>0?'Partial':'Pending'},CL={Paid:'ok',Partial:'pt',Pending:'no'};
const bar=p=>`<div class="bar"><i style="width:${Math.min(100,p)}%"></i></div>`;
const fdt=t=>new Date(t).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const cl=x=>String(x==null?'':x).replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim();let seenK={};
function parseXl(wb){const out=[];wb.SheetNames.forEach(sn=>{const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});
 const h=rows.findIndex(r=>r.some(c=>/roll/i.test(cl(c))));if(h<0)return;const H=rows[h].map(c=>cl(c).toLowerCase());
 const iR=H.findIndex(c=>c.includes('roll')),iF=H.findIndex(c=>c.includes('father')),iN=H.findIndex(c=>c.includes('name')&&!c.includes('father'));
 const y=iF>=0?1:2,sec=sn.replace(/\s+/g,'').replace(/-/g,'').replace(/^([A-Za-z]+)(\d.*)$/,'$1-$2').toUpperCase();
 rows.slice(h+1).forEach(r=>{if(typeof r[0]!=='number')return;const ro=cl(r[iR]),n=cl(r[iN]);if(!ro||!n)return;let k=ro.replace(/[^A-Za-z0-9-]/g,'');if(seenK[k])k+='-'+sec.replace(/[^A-Za-z0-9]/g,'');seenK[k]=1;out.push({k,y,s:sec,r:ro,n,f:iF>=0?cl(r[iF]):''})})});return out}
function passes(b){calcBC();const c=C(),I=c.bi[b]||{},l=D.filter(s=>info(s.k).bus==b).sort((x,y)=>(+info(x.k).seat||999)-(+info(y.k).seat||999)||x.s.localeCompare(y.s)||x.r.localeCompare(y.r,undefined,{numeric:true}));
 if(!l.length)return toast('No students in Bus '+b);
 const miss=l.filter(s=>{const i=info(s.k);return !i.seat||!(i.hotel||I.hotel)||!i.room}).length,im=!(I.inc&&I.ph);
 if((miss||im)&&!confirm((miss?miss+' student(s) have seat / hotel / room missing. ':'')+(im?'Bus incharge name or phone is missing. ':'')+'Print passes anyway?'))return;
 const ps=s=>{const i=info(s.k),ht=i.hotel||I.hotel||'';return `<div class="ps"><div class="ph"><b>KIPS COLLEGE SHEIKHUPURA</b><span>Sargodha Road · Boys Campus</span><em>${esc(c.trip)}${c.dest?' – '+esc(c.dest):''}</em></div><div class="pb"><small>BUS</small><b>${b}</b></div>
 <dl><dt>Student</dt><dd>${esc(s.n)}</dd><dt>${s.y==3?'Reference':'Section / Roll #'}</dt><dd>${s.y==3?esc(s.ref):esc(s.s)+' / '+esc(s.r)}</dd><dt>Hotel</dt><dd>${esc(ht)||'—'}</dd></dl>
 <div class="pr"><span>Seat<b>${i.seat||'—'}</b></span><span>Floor<b>${esc(i.floor)||'—'}</b></span><span>Room<b>${esc(i.room)||'—'}</b></span></div>
 <div class="pf">Bus Incharge: <b>${esc(I.inc)||'—'}</b> · ${esc(I.ph)||'—'}</div></div>`};
 let pg='';for(let i=0;i<l.length;i+=6){const ch=l.slice(i,i+6);pg+=`<div class="pg">${ch.map(ps).join('')}${'<div></div>'.repeat(6-ch.length)}</div>`}
 modal(`<div class="tools noprint" style="max-width:700px"><b>Bus ${b} – ${l.length} passes · ${Math.ceil(l.length/6)} A4 page(s)</b><button class="btn pri" data-a="print">Print / Save PDF</button><button class="btn" data-a="x">Close</button><span class="k" style="width:100%">Tip: in the print window choose paper size A4, margins Default, and turn Headers and footers off.</span></div><div class="pgs">${pg}</div>`)}
function outModal(k){const o=k?S(k):{};modal(`<div class="mc" style="margin:auto"><h3>${k?'Edit':'Add'} outsider student</h3>
<label>Student name *<input id="on" value="${esc(o.n||'')}"></label><label>Father name *<input id="of" value="${esc(o.f||'')}"></label><label>Contact / WhatsApp no. *<input id="op" type="tel" value="${esc(k?info(k).ph||o.ph||'':'')}" placeholder="03xx xxxxxxx"></label><label>Reference (who referred) *<input id="orf" value="${esc(o.ref||'')}"></label>
<div class="row" style="margin-top:12px"><button class="btn pri" data-a="outok" data-k="${k||''}">Save</button>${k?'':'<button class="btn pay" data-a="outok" data-k="" data-pay="1">Save &amp; take payment</button>'}<button class="btn" data-a="x">Cancel</button></div></div>`)}
function saveFile(n,d){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d],{type:'text/plain'}));a.download=n;document.body.appendChild(a);a.click();a.remove()}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3000)}
function stats(a){const r={t:a.length,Paid:0,Partial:0,Pending:0,c:0};a.forEach(s=>{r[st(s.k)]++;r.c+=paid(s.k)});r.due=Math.max(0,r.t*C().fee-r.c);r.pc=r.t?Math.round(r.c/(r.t*C().fee)*100):0;return r}
async function put(col,id,v,quiet){let ok=true;const pv=M[col][id];if(v===null)delete M[col][id];else M[col][id]=v;
 try{if(db){const r=db.doc(col+'/'+id);v===null?await r.delete():await r.set(v);try{localStorage.setItem('kipsTripBackup',JSON.stringify(M))}catch(_){}}else localStorage.setItem(LK,JSON.stringify(M))}
 catch(e){ok=false;if(pv===undefined)delete M[col][id];else M[col][id]=pv;toast('Save failed – only Editors can make changes')}
 if(!quiet)render();return ok}
const nl=()=>L?['payments','info','cfg'].reduce((n,c)=>n+Object.keys(L[c]||{}).length,0):0;
function banner(){if(cloud<0)return `<div class="warn">⚠ <b>Database not connected.</b> Check the internet, the login account and the Firestore rules, then reload the page.</div>`;
 if(cloud==1&&!D0.length)return `<div class="warn inf">No student list found. Go to Settings → Import student list and choose students.json.</div>`;
 if(cloud==1&&nl())return `<div class="warn inf">☁ This device has <b>${nl()}</b> saved records that are not in the cloud database yet. <button class="btn sm pri" data-a="upl">Upload to cloud</button> <button class="btn sm" data-a="dis">Discard</button></div>`;return ''}
const setCfg=(p,q)=>put('cfg','main',{...(M.cfg.main||{}),...p},q);
const elig=s=>{const x=st(s.k);return x=='Paid'||(C().busPartial&&x=='Partial')};
function calcBC(){BC={};D.forEach(s=>{const b=info(s.k).bus;if(b)BC[b]=(BC[b]||0)+1})}
function dash(){const c=C(),a=stats(D),dp=a.t?a.Paid/a.t*100:0,pp=a.t?a.Partial/a.t*100:0,used=Object.values(BC).reduce((x,y)=>x+y,0);
 let h=`<div class="grid"><div class="card"><div class="k">Total students</div><div class="v">${a.t}</div></div><div class="card"><div class="k">Fully paid</div><div class="v ok">${a.Paid}</div></div><div class="card"><div class="k">Partial</div><div class="v pt">${a.Partial}</div></div><div class="card"><div class="k">Pending</div><div class="v no">${a.Pending}</div></div><div class="card"><div class="k">Collected</div><div class="v ok">${rs(a.c)}</div></div><div class="card"><div class="k">Outstanding</div><div class="v no">${rs(a.due)}</div></div><div class="card"><div class="k">Bus seats used</div><div class="v">${used}/${c.buses*c.cap}</div></div></div>
 <div class="two"><div class="card"><b>Collection status</b><div class="row" style="justify-content:center;margin-top:12px"><div class="don" style="background:conic-gradient(var(--ok) 0 ${dp}%,var(--pt) ${dp}% ${dp+pp}%,var(--no) ${dp+pp}% 100%)"><b>${a.pc}%</b></div></div><div class="lgd"><span class="ok">● Paid</span><span class="pt">● Partial</span><span class="no">● Pending</span></div></div>`;
 const rec=[];D.forEach(s=>pays(s.k).forEach((p,i)=>rec.push({s,p,i})));rec.sort((x,y)=>y.p.at.localeCompare(x.p.at));
 h+=`<div class="card"><b>Recent payments</b><div class="sc"><table>${rec.slice(0,6).map(r=>`<tr><td>${esc(r.s.n)}<div class="k">${r.s.s} · ${r.s.r}</div></td><td>${rs(r.p.a)}</td><td class="k">${fdt(r.p.at)}</td><td><button class="btn sm" data-a="rc" data-k="${r.s.k}" data-i="${r.i}">Receipt</button></td></tr>`).join('')||'<tr><td class="k">No payments recorded yet.</td></tr>'}</table></div></div></div>`;
 SEC.forEach(g=>{if(!g.l.length)return;const y=stats(D.filter(s=>s.y==g.y));h+=`<div class="card"><div class="row"><b>${yn(g.y)} – section-wise report</b><span class="k">${y.Paid} paid · ${y.Partial} partial · ${rs(y.c)} collected</span></div><div class="sc"><table><tr><th>Section</th><th>Class Incharge</th><th>Students</th><th>Paid</th><th>Partial</th><th>Pending</th><th>Collected</th><th>Outstanding</th><th>Progress</th></tr>`;
  g.l.forEach(s=>{const x=stats(D.filter(d=>d.y==g.y&&d.s==s));h+=`<tr class="lnk" data-a="sec" data-y="${g.y}" data-s="${s}"><td><b>${s}</b></td><td>${esc(c.inc[g.y+'|'+s])||'<span class="k">—</span>'}</td><td>${x.t}</td><td>${x.Paid}</td><td>${x.Partial}</td><td>${x.Pending}</td><td>${rs(x.c)}</td><td>${rs(x.due)}</td><td style="min-width:110px">${bar(x.pc)}</td></tr>`});h+=`</table></div></div>`});
 return h}
function secs(){const c=C();let h='';SEC.forEach(g=>{if(!g.l.length)return;h+=`<div class="chips"><span class="k">${yn(g.y)}:</span>`+g.l.map(s=>`<button class="chip ${g.y==cy&&s==cs?'on':''}" data-a="sec" data-y="${g.y}" data-s="${s}">${s}</button>`).join('')+`</div>`});
